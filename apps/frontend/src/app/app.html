<a class="skip-link" href="#contenu-principal">Aller au contenu</a>
<app-age-call-gate />
@if (ageGate.active() || ageGate.passed()) {
  <app-intro-overlay />
}
@if (ageGate.passed() && intro.playing()) {
  <app-particle-background />
}
<app-logo-relay-overlay />
<app-site-header />
<main id="contenu-principal" class="app-main">
  <router-outlet />
</main>
<app-site-footer />
<nav
  class="mobile-sticky"
  [class.mobile-sticky--visible]="stickyVisible()"
  [attr.aria-hidden]="stickyVisible() ? null : 'true'"
  aria-label="Actions rapides"
>
  <a
    class="cta cta--md cta--primary review-cta"
    href="https://dartchain.pages.dev"
    target="_blank"
    rel="noopener noreferrer"
    [attr.tabindex]="stickyVisible() ? null : -1"
    >Démo</a
  >
  <a
    routerLink="/faq"
    class="cta cta--md cta--secondary review-cta"
    [attr.tabindex]="stickyVisible() ? null : -1"
    >FAQ</a
  >
</nav>
