<article class="doc auth-doc">
  <app-doc-eyebrow label="Compte" />
  <h1>Se connecter.</h1>
  <p class="doc__lead">Accédez à votre compte pour soumettre une question dans la FAQ.</p>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="auth-field">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label class="auth-field">
      <span>Mot de passe</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="auth-error" role="alert">{{ error() }}</p>
    }

    <div class="doc__actions">
      <button type="submit" class="cta cta--md cta--primary review-cta" [disabled]="submitting()">
        {{ submitting() ? 'Connexion…' : 'Se connecter' }}
      </button>
      <a routerLink="/inscription" class="cta cta--md cta--secondary review-cta">Créer un compte</a>
    </div>
  </form>
</article>
