<article class="doc auth-doc">
  <app-doc-eyebrow label="Compte" />
  <h1>Créer un compte.</h1>
  <p class="doc__lead">
    Un compte permet de poser une question dans la FAQ. Aucune donnée wallet n’est demandée.
  </p>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="auth-field">
      <span>Nom affiché</span>
      <input type="text" formControlName="displayName" autocomplete="nickname" maxlength="80" />
    </label>
    <label class="auth-field">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" maxlength="120" />
    </label>
    <label class="auth-field">
      <span>Mot de passe (8 caractères min.)</span>
      <input type="password" formControlName="password" autocomplete="new-password" maxlength="72" />
    </label>

    @if (error()) {
      <p class="auth-error" role="alert">{{ error() }}</p>
    }

    <div class="doc__actions">
      <button type="submit" class="cta cta--md cta--primary review-cta" [disabled]="submitting()">
        {{ submitting() ? 'Création…' : 'Créer mon compte' }}
      </button>
      <a routerLink="/connexion" class="cta cta--md cta--secondary review-cta">Déjà inscrit ?</a>
    </div>
  </form>
</article>
