spring.application.name=dartchain-review-backend
server.port=8081

# H2 file DB — local MVP (swap to Postgres later)
spring.datasource.url=jdbc:h2:file:./data/dartchain-review;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info

# JWT — override in prod via env REVIEW_JWT_SECRET
dartchain.review.jwt.secret=${REVIEW_JWT_SECRET:dartchain-review-dev-secret-change-me-32chars-min}
dartchain.review.jwt.ttl-hours=168
dartchain.review.cors.allowed-origins=http://localhost:4201,http://127.0.0.1:4201
